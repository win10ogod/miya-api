[workspace]
members = [
    "crates/agent-protocol",
    "crates/agent-kernel",
    "crates/provider-core",
    "crates/provider-openai",
    "crates/provider-anthropic",
    "crates/context-store",
    "crates/api-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
agent-protocol = { path = "crates/agent-protocol" }
agent-kernel = { path = "crates/agent-kernel" }
provider-core = { path = "crates/provider-core" }
provider-openai = { path = "crates/provider-openai" }
provider-anthropic = { path = "crates/provider-anthropic" }
context-store = { path = "crates/context-store" }
aes-gcm = "0.10"
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
surrealkv = "0.21.1"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
